<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Snake Game Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0a0f1f;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Press Start 2P', cursive;
    }

    .game-container {
      background: #1c1c28;
      border: 6px solid #ffb400;
      border-radius: 20px;
      width: 350px;
      padding: 20px;
      box-shadow: 0 0 20px #000;
      text-align: center;
      color: white;
    }

    .header {
      background: linear-gradient(to right, #42ecf5, #1897ff);
      padding: 10px;
      font-size: 20px;
      font-weight: bold;
      color: yellow;
      border-radius: 10px 10px 0 0;
    }

    /* Glow animation */
    @keyframes glow {

      0%,
      100% {
        text-shadow: none;
        opacity: 0.6;
      }

      50% {
        text-shadow: 0 0 10px #ffd700, 0 0 20px #ffb400;
        opacity: 1;
      }
    }

    .insert-coin {
      font-size: 16px;
      color: #d4a017;
      margin: 30px 0 20px;
      animation: glow 2s infinite;
    }

    /* From Uiverse.io by elijahgummer */
    .button-with-icon {
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #0f988e;
      letter-spacing: 1px;
      font-family: 'Press Start 2P', cursive;
      padding: 0 12px;
      text-align: center;
      width: 120px;
      height: 40px;
      font-size: 14px;
      text-transform: uppercase;
      font-weight: normal;
      border-radius: 3px;
      outline: none;
      user-select: none;
      cursor: pointer;
      transform: translateY(0px);
      position: relative;
      box-shadow:
        inset 0 30px 30px -15px rgba(255, 255, 255, 0.1),
        inset 0 0 0 1px rgba(255, 255, 255, 0.3),
        inset 0 1px 20px rgba(0, 0, 0, 0),
        0 3px 0 #0f988e,
        0 3px 2px rgba(0, 0, 0, 0.2),
        0 5px 10px rgba(0, 0, 0, 0.1),
        0 10px 20px rgba(0, 0, 0, 0.1);
      background: #15ccbe;
      color: white;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
      transition: 150ms all ease-in-out;
    }

    .button-with-icon .icon {
      margin-right: 8px;
      width: 24px;
      height: 24px;
      transition: all 0.5s ease-in-out;
    }

    .button-with-icon:active {
      transform: translateY(3px);
      box-shadow:
        inset 0 16px 2px -15px rgba(0, 0, 0, 0),
        inset 0 0 0 1px rgba(255, 255, 255, 0.15),
        inset 0 1px 20px rgba(0, 0, 0, 0.1),
        0 0 0 #0f988e,
        0 0 0 2px rgba(255, 255, 255, 0.5),
        0 0 0 rgba(0, 0, 0, 0),
        0 0 0 rgba(0, 0, 0, 0);
    }

    .button-with-icon:hover .text {
      transform: translateX(80px);
    }

    .button-with-icon:hover .icon {
      transform: translate(23px);
    }

    .text {
      transition: all 0.5s ease-in-out;
    }

    .speed-box {
      border: 2px solid #314a76;
      margin: 20px auto;
      padding: 8px 12px;
      display: inline-block;
      color: #ffb400;
      font-size: 12px;
      cursor: pointer;
    }


    .controls {
      font-size: 10px;
      margin-top: 15px;
      color: #cfcfe3;
    }

    .footer {
      margin-top: 25px;
      padding: 8px;
      border-top: 3px solid #444;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }

    .footer span:first-child {
      color: #ffb400;
    }

    .footer span:last-child {
      color: red;
    }
  </style>
</head>

<body>
  <div class="game-container">
    <div class="header">CHIKI'S CHASE</div>

    <div class="insert-coin">INSERT COIN</div>

    <!-- From Uiverse.io by elijahgummer -->
    <button class="button-with-icon" onclick="startGame()">
      <svg class="icon" id="Play" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path class="color000000 svgShape" fill="#ffffff"
          d="M12 39c-.549 0-1.095-.15-1.578-.447A3.008 3.008 0 0 1 9 36V12c0-1.041.54-2.007 1.422-2.553a3.014 3.014 0 0 1 2.919-.132l24 12a3.003 3.003 0 0 1 0 5.37l-24 12c-.42.21-.885.315-1.341.315z">
        </path>
      </svg>
      <span class="text">START</span>
    </button>

    <!--<div class="start-btn">▶ START</div>-->
    <div class="controls">PRESS ARROW KEYS TO MOVE</div>

    <div class="footer">
      <span>HIGH SCORE</span>
      <span>1UP</span>
    </div>
  </div>
      <script>
      function startGame() {
        fetch('/start_game', {
          method: 'POST'
        })
          .then(res => res.json())
          .then(data => {
            console.log('Server response:', data);
            // If you want, you can show this in the page later.
            // For example: document.querySelector('.insert-coin').innerText = 'GAME ' + data.status.toUpperCase();
          })
          .catch(err => {
            console.error('Error starting game:', err);
            alert('Could not start game. Is the Python server running?');
          });
      }
    </script>

</body>

</html>
